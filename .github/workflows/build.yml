name: Build FloatClock Universal(arm64+x86_64)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v5

      - name: compile arm64 binary
        run: |
          make clean
          # 交叉编译 arm64
          swiftc -target arm64-apple-macos13.0 FloatClock.swift -o bin-arm64/FloatClock

      - name: compile x86_64 binary (Intel)
        run: |
          mkdir -p bin-x86_64
          # 交叉编译 x86_64‑macOS13
          swiftc -target x86_64-apple-macos13.0 FloatClock.swift -o bin-x86_64/FloatClock

      - name: lipo merge → Universal 通用二进制
        run: |
          mkdir -p bin-universal
          lipo -create bin-arm64/FloatClock bin-x86_64/FloatClock -output bin-universal/FloatClock
          # 校验架构，打印输出
          lipo -info bin-universal/FloatClock

      - name: Assemble valid .app bundle
        run: |
          mkdir -p FloatClock.app/Contents/MacOS
          mkdir -p FloatClock.app/Contents/Resources
          cp bin-universal/FloatClock FloatClock.app/Contents/MacOS/FloatClock

          # 完整有效的Info.plist，最低系统macOS13.0
          cat > FloatClock.app/Contents/Info.plist <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>FloatClock</string>
    <key>CFBundleIdentifier</key>
    <string>com.maddada.FloatClock</string>
    <key>CFBundleName</key>
    <string>FloatClock</string>
    <key>CFBundleVersion</key>
    <string>1.0</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0</string>
    <key>LSMinimumSystemVersion</key>
    <string>13.0</string>
    <key>LSUIElement</key>
    <true/>
</dict>
</plist>
EOF

      - name: Zip app
        run: zip -r FloatClock-universal-macos13.zip FloatClock.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FloatClock‑universal‑macos13
          path: FloatClock-universal-macos13.zip
          if-no-files-found: error
