name: Build FloatClock Universal(arm64+x86_64)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v5

      - name: compile arm64 binary
        run: |
          make clean
          mkdir -p bin-arm64
          swiftc -target arm64-apple-macos13.0 FloatClock.swift -o bin-arm64/FloatClock

      - name: compile x86_64 binary (Intel)
        run: |
          mkdir -p bin-x86_64
          swiftc -target x86_64-apple-macos13.0 FloatClock.swift -o bin-x86_64/FloatClock

      - name: lipo merge → Universal 通用二进制
        run: |
          mkdir -p bin-universal
          lipo -create bin-arm64/FloatClock bin-x86_64/FloatClock -output bin-universal/FloatClock
          lipo -info bin-universal/FloatClock

      - name: Assemble valid .app bundle
        run: |
          mkdir -p FloatClock.app/Contents/MacOS
          mkdir -p FloatClock.app/Contents/Resources
          cp bin-universal/FloatClock FloatClock.app/Contents/MacOS/FloatClock
          echo  | base64 --decode > FloatClock.app/Contents/Info.plist

      - name: Zip app
        run: zip -r FloatClock-universal-macos13.zip FloatClock.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: FloatClock-universal-macos13
          path: FloatClock-universal-macos13.zip
          if-no-files-found: error
